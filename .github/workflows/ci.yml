name: Buscador CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP tests
        run: for f in tests/*.php; do php "$f"; done
      - name: Shell contracts
        run: for f in tests/*.sh; do bash "$f"; done
      - name: Node bridge tests
        run: for f in tests/*.mjs; do node "$f"; done
