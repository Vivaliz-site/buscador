name: Buscador CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance guard tests
        run: python3 -m unittest tests.test_check_issue_comment_listeners -v
      - name: Issue-comment listener governance guard
        run: python3 scripts/governance/check-issue-comment-listeners.py --workflows-root .
      - name: PHP lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP tests
        run: for f in tests/*.php; do php "$f"; done
      - name: Shell contracts
        run: for f in tests/*.sh; do bash "$f"; done
      - name: Node bridge tests
        run: for f in tests/*.mjs; do node "$f"; done
      - name: Buscador MCP install
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix ops/buscador-mcp
      - name: Buscador MCP tests
        run: npm test --prefix ops/buscador-mcp
