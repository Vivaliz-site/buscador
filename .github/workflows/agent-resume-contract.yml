name: Resume Execution Contract
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-resume-contract.yml'
      - 'scripts/check_agent_resume_contract.py'
      - 'tests/test_agent_resume_contract.py'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-resume-contract.yml'
      - 'scripts/check_agent_resume_contract.py'
      - 'tests/test_agent_resume_contract.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Retome negative regressions
        run: python3 -m unittest discover -s tests -p 'test_agent_resume_contract.py' -v
      - name: Verify every agent entrypoint
        run: python3 scripts/check_agent_resume_contract.py
